name: PDF fordítása és kiadása

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-release
  cancel-in-progress: true

jobs:
  build:
    name: PDF fordítása és kiadása
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Times New Roman letöltése
        run: |
          curl -sSfL --retry 3 -o times32.exe https://downloads.sourceforge.net/corefonts/times32.exe
          echo "db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab  times32.exe" | sha256sum -c -
          7z e -y -ofonts times32.exe '*.TTF'

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: PDF fordítása
        run: typst compile --font-path fonts szakdolgozat.typ szakdolgozat.pdf

      - name: Release frissítése
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest szakdolgozat.pdf \
            --target "${{ github.sha }}" \
            --title "Szakdolgozat ($(date -u +'%Y-%m-%d %H:%M') UTC, ${GITHUB_SHA::7})" \
            --notes "Automatikusan generált PDF a(z) ${{ github.sha }} commitból." \
            --latest
